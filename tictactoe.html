<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic Tac Toe - Aman's Arcade</title>
  <meta name="description" content="Play classic Tic Tac Toe in your browser. Play local PvP or challenge our smart Minimax AI. Free, responsive, and neon glassmorphic styled.">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="tictactoe.css">
</head>
<body>

  <!-- Header -->
  <header class="arcade-header">
    <a href="index.html" class="btn-icon" title="Return to Hub">
      <svg viewBox="0 0 24 24">
        <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
      </svg>
    </a>
    <div class="arcade-logo">TIC TAC TOE</div>
    <div class="header-controls">
      <button class="btn-icon sound-toggle-btn" title="Mute/Unmute Sounds">
        <!-- SVG will be injected by shared.js -->
      </button>
    </div>
  </header>

  <main class="main-content">
    
    <!-- Controls Section -->
    <section class="game-settings glass-panel fade-in">
      <div class="setting-group">
        <span class="setting-label">Game Mode</span>
        <div class="segmented-control">
          <button id="mode-ai" class="control-btn active">VS COMPUTER</button>
          <button id="mode-pvp" class="control-btn">2 PLAYERS (LOCAL)</button>
        </div>
      </div>
      
      <div class="setting-group" id="difficulty-group">
        <span class="setting-label">AI Difficulty</span>
        <div class="segmented-control">
          <button class="diff-btn" data-diff="easy">EASY</button>
          <button class="diff-btn active" data-diff="medium">MEDIUM</button>
          <button class="diff-btn" data-diff="hard">UNBEATABLE</button>
        </div>
      </div>
    </section>

    <!-- Scoreboard Section -->
    <section class="scoreboard-container fade-in" style="animation-delay: 0.1s;">
      <div class="score-card glass-panel player-x-score">
        <span class="score-label" id="p1-label">PLAYER X</span>
        <span class="score-val" id="score-x">0</span>
      </div>
      <div class="score-card glass-panel ties-score">
        <span class="score-label">TIES</span>
        <span class="score-val" id="score-ties">0</span>
      </div>
      <div class="score-card glass-panel player-o-score">
        <span class="score-label" id="p2-label">COMPUTER (O)</span>
        <span class="score-val" id="score-o">0</span>
      </div>
    </section>

    <!-- Status Banner -->
    <div class="status-banner glass-panel fade-in" style="animation-delay: 0.15s;" id="status-text">
      YOUR TURN (X)
    </div>

    <!-- Game Board -->
    <section class="board-container glass-panel fade-in" style="animation-delay: 0.2s;">
      <div class="game-board" id="board">
        <button class="board-cell" data-index="0" aria-label="Cell 1"></button>
        <button class="board-cell" data-index="1" aria-label="Cell 2"></button>
        <button class="board-cell" data-index="2" aria-label="Cell 3"></button>
        <button class="board-cell" data-index="3" aria-label="Cell 4"></button>
        <button class="board-cell" data-index="4" aria-label="Cell 5"></button>
        <button class="board-cell" data-index="5" aria-label="Cell 6"></button>
        <button class="board-cell" data-index="6" aria-label="Cell 7"></button>
        <button class="board-cell" data-index="7" aria-label="Cell 8"></button>
        <button class="board-cell" data-index="8" aria-label="Cell 9"></button>
      </div>
    </section>

    <!-- Actions -->
    <section class="game-actions fade-in" style="animation-delay: 0.25s;">
      <button class="btn-primary" id="btn-restart">RESTART MATCH</button>
      <button class="btn-secondary" id="btn-reset-scores">RESET SCORES</button>
    </section>

  </main>

  <script src="shared.js"></script>
  <script src="tictactoe.js"></script>
</body>
</html>
